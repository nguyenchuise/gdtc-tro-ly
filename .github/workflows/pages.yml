# Deploy lên GitHub Pages mỗi khi có thay đổi trên nhánh main (kể cả khi cô sửa/tải ảnh trên web GitHub).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tự ánh xạ ảnh trong media/sach/<mã-bài>/
        run: node tools/build-media-manifest.mjs
      - name: Kiểm tra dữ liệu bài tập (sai thì dừng, trang cũ vẫn chạy)
        run: node tools/validate-data.mjs
      - name: Kiểm tra logic chấm điểm và tìm kiếm
        run: node tools/test-scoring.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
